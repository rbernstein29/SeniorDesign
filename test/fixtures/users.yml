<% password_digest = BCrypt::Password.create(ENV.fetch("TEST_FIXTURE_PASSWORD", "Aegis!TestOnly!NotForProduction!2026")) %>

admin_user:
  name: Admin User
  email_address: admin@example.com
  password_digest: <%= password_digest %>
  organization_id: <%= ActiveRecord::FixtureSet.identify(:acme) %>
  access_level: admin
  api_key: <%= SecureRandom.urlsafe_base64(32) %>
  email_verified_at: <%= Time.current %>

readonly_user:
  name: Read Only User
  email_address: readonly@example.com
  password_digest: <%= password_digest %>
  organization_id: <%= ActiveRecord::FixtureSet.identify(:acme) %>
  access_level: read_only
  api_key: <%= SecureRandom.urlsafe_base64(32) %>
  email_verified_at: <%= Time.current %>

other_org_user:
  name: Other Org Admin
  email_address: other@example.com
  password_digest: <%= password_digest %>
  organization_id: <%= ActiveRecord::FixtureSet.identify(:other_org) %>
  access_level: admin
  email_verified_at: <%= Time.current %>
